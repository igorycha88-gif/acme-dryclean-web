# Prometheus (production, VPS /opt/app/monitoring/prometheus.yml).
# ⚠️ Embedded DNS Docker сломан ядром VPS — таргеты ТОЛЬКО по статическим IP
# сети dryclean-net (172.22.0.0/16):
#   172.22.0.2  dryclean-content
#   172.22.0.4  dryclean-tracking
#   172.22.0.5  dryclean-postgres-exporter (TASK-DNS-4)
# См. требования/ЧТЗ_Фикс_Docker_DNS_VPS.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "tracking"
    static_configs:
      - targets: ["172.22.0.4:8020"]
    metrics_path: /metrics

  - job_name: "content"
    static_configs:
      - targets: ["172.22.0.2:8011"]
    metrics_path: /metrics

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["172.22.0.5:9187"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
