name: VPS Diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    name: Collect VPS state
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Diagnostics via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: false
          command_timeout: 3m
          script: |
            echo "=== nginx.conf structure ==="
            grep -n "server_name\|map \|include\|location = \|upstream\|http {" /etc/nginx/nginx.conf | head -40
