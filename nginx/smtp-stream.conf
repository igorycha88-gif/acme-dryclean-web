# SMTP-ретранслятор для frontend-контейнера (хостовый nginx, stream-модуль).
#
# Причина (BUG-002, 2026-09-22): ядро VPS 5.2.0 без nf_nat — контейнеры dryclean-net
# не имеют outbound-доступа в интернет (TCP к внешним IP — TIMEOUT, embedded DNS
# сломан). Заявки (SMTP → smtp.yandex.ru:465) из frontend-контейнера уходят через
# этот TCP-passthrough на шлюзе моста. TLS и SMTP AUTH — end-to-end из nodemailer.
#
# Установка на VPS (одноразово, вне deploy-vps.sh):
#   1) Убедиться, что stream-модуль загружен. В debian/ubuntu-сборке nginx:
#      ls /etc/nginx/modules-enabled/50-mod-stream.conf  # load_module modules/ngx_stream_module.so
#      Если /etc/nginx/nginx.conf не подключает modules-enabled (кастомный конфиг
#      проекта), добавить ПЕРВОЙ строкой: load_module modules/ngx_stream_module.so;
#   2) Скопировать этот файл: cp nginx/smtp-stream.conf /etc/nginx/smtp-stream.conf
#   3) В main-контексте /etc/nginx/nginx.conf (вне http{}): include /etc/nginx/smtp-stream.conf;
#   4) nginx -t && nginx -s reload
#   5) В /opt/app/.env: SMTP_HOST=172.22.0.1 и SMTP_TLS_SERVERNAME=smtp.yandex.ru
#
# Проверка: ss -tlnp | grep 172.22.0.1:465
stream {
    # runtime-DNS: смена IP Яндекса не требует reload nginx
    resolver 77.88.8.8 8.8.8.8 valid=300s ipv6=off;
    map $server_port $smtp_upstream {
        465     smtp.yandex.ru:465;
    }
    server {
        # только интерфейс моста dryclean-net — наружу порт не торчит
        listen 172.22.0.1:465;
        proxy_pass $smtp_upstream;
        proxy_connect_timeout 10s;
        proxy_timeout 60s;
    }
}
